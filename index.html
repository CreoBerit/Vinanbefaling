<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Vinanbefaler"/>
  <meta name="theme-color" content="#0e0b08"/>
  <title>Vinanbefaler</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:#0e0b08;color:#f0e8d8;font-family:'Lato',sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
    ::-webkit-scrollbar{display:none}
    #app{max-width:430px;margin:0 auto;padding-bottom:52px;min-height:100vh}

    .header{padding:52px 20px 28px;background:linear-gradient(180deg,rgba(110,30,5,.22),transparent);text-align:center;position:relative;overflow:hidden}
    .header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 0%,rgba(160,50,15,.14),transparent);pointer-events:none}
    .header-icon{font-size:44px;display:block;margin-bottom:10px;filter:drop-shadow(0 0 18px rgba(212,168,67,.4))}
    .header h1{font-family:Georgia,serif;font-size:33px;font-weight:600;color:#f0e8d8;margin-bottom:6px}
    .header p{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.18em}

    .form{padding:6px 16px 0}
    .lbl{display:block;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.38);text-transform:uppercase;margin-bottom:7px}
    .field{margin-bottom:15px}

    input[type=text],textarea{-webkit-appearance:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#f0e8d8;font-family:'Lato',sans-serif;border-radius:12px;width:100%;outline:none;transition:border-color .2s,background .2s}
    input[type=text]{padding:13px 15px;font-size:15px}
    textarea{padding:11px 15px;font-size:13px;resize:none;line-height:1.6;height:68px}
    input:focus,textarea:focus{border-color:rgba(212,168,67,.5);background:rgba(212,168,67,.04)}
    input::placeholder,textarea::placeholder{color:rgba(255,255,255,.25)}

    .cat-scroll{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

    .cat-btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:22px;font-size:13px;cursor:pointer;font-family:'Lato',sans-serif;transition:all .18s;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.7);line-height:1;width:100%}

    .price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .price-btn{padding:10px 4px;border-radius:10px;font-size:11px;cursor:pointer;font-family:'Lato',sans-serif;text-align:center;transition:all .18s;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.42);line-height:1.3}
    .price-btn.on{background:rgba(212,168,67,.14);border-color:rgba(212,168,67,.4);color:#d4a843}

    .go-btn{width:100%;padding:15px;border-radius:13px;border:none;font-family:'Lato',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;background:linear-gradient(135deg,#d4a843,#a07830);color:#1a0e04}
    .go-btn:disabled{background:rgba(255,255,255,.06);color:rgba(255,255,255,.28);cursor:not-allowed}
    .go-btn:not(:disabled):active{transform:scale(.98)}

    .err{margin:14px 16px 0;padding:13px 15px;background:rgba(170,35,15,.14);border:1px solid rgba(170,35,15,.3);border-radius:11px;font-size:13px;color:#e08070;display:none}

    #results{display:none;padding:26px 16px 0}
    .divider{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .dline{flex:1;height:1px}
    .dline.l{background:linear-gradient(90deg,transparent,rgba(255,255,255,.1))}
    .dline.r{background:linear-gradient(90deg,rgba(255,255,255,.1),transparent)}
    .dtxt{font-size:11px;color:rgba(255,255,255,.28);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
    .intro{font-family:Georgia,serif;font-size:15px;font-style:italic;color:rgba(255,255,255,.48);line-height:1.65;text-align:center;margin-bottom:18px;padding:0 6px;display:none}

    .card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:16px 14px;cursor:pointer;margin-bottom:10px;animation:fadeUp .4s ease both}
    .card:active{background:rgba(255,255,255,.07)}
    .card-top{display:flex;gap:10px;align-items:flex-start}
    .badge{position:relative;width:50px;height:50px;flex-shrink:0}
    .badge svg{position:absolute;top:0;left:0}
    .card-info{flex:1;min-width:0}
    .card-meta{font-size:10px;color:rgba(255,255,255,.3);letter-spacing:.15em;text-transform:uppercase;margin-bottom:2px}
    .card-name{font-family:Georgia,serif;font-size:17px;font-weight:600;color:#f0e8d8;line-height:1.25;margin-bottom:3px}
    .card-prod{font-size:11px;color:rgba(255,255,255,.38);margin-bottom:8px}
    .tags{display:flex;flex-wrap:wrap;gap:4px}
    .tag{font-size:10px;padding:2px 8px;background:rgba(212,168,67,.1);border:1px solid rgba(212,168,67,.18);border-radius:20px;color:rgba(212,168,67,.75)}
    .card-price{text-align:right;flex-shrink:0;padding-top:2px}
    .price-num{font-family:Georgia,serif;font-size:21px;font-weight:700;color:#d4a843;line-height:1}
    .price-kr{font-size:10px;color:rgba(255,255,255,.28);margin-top:1px}
    .price-alc{font-size:10px;color:rgba(255,255,255,.22);margin-top:3px}

    .expand{overflow:hidden;max-height:0;transition:max-height .32s ease}
    .expand.open{max-height:400px}
    .expand-inner{border-top:1px solid rgba(255,255,255,.07);margin-top:12px;padding-top:12px}
    .card-why{font-size:13px;color:rgba(255,255,255,.62);line-height:1.65;margin-bottom:10px}
    .card-dets{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    .card-det{font-size:11px;color:rgba(255,255,255,.45)}
    .vmpol-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#d4a843;background:rgba(212,168,67,.1);border:1px solid rgba(212,168,67,.25);border-radius:8px;padding:7px 14px;text-decoration:none}
    .hint{text-align:center;margin-top:8px;font-size:9px;color:rgba(255,255,255,.18);letter-spacing:.08em}
    .footer{text-align:center;font-size:10px;color:rgba(255,255,255,.12);margin-top:22px;letter-spacing:.07em}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <span class="header-icon">🍷</span>
    <h1>Vinanbefaler</h1>
    <p>VINMONOPOLET · AI SOMMELIER</p>
  </div>
  <div class="form">
    <div class="field">
      <label class="lbl">Hva spiser du?</label>
      <input type="text" id="dish" placeholder="f.eks. lammeribbe, laks, pasta…"/>
    </div>
    <div class="field">
      <label class="lbl">Vintype</label>
      <div class="cat-scroll" id="cats"></div>
    </div>
    <div class="field">
      <label class="lbl">Prisklasse</label>
      <div class="price-grid" id="prices"></div>
    </div>
    <div class="field">
      <label class="lbl">Preferanser <span style="text-transform:none;letter-spacing:0;color:rgba(255,255,255,.2)">(valgfritt)</span></label>
      <textarea id="pref" placeholder="f.eks. ikke for tannisk, liker fruktige viner…"></textarea>
    </div>
    <button class="go-btn" id="goBtn" disabled>🔍 Finn vinanbefaling</button>
  </div>
  <div class="err" id="errBox"></div>
  <div id="results">
    <div class="divider">
      <div class="dline l"></div>
      <span class="dtxt" id="divTxt"></span>
      <div class="dline r"></div>
    </div>
    <p class="intro" id="introTxt"></p>
    <div id="cards"></div>
    <p class="footer">AI-ANBEFALINGER · SJEKK PRIS PÅ VINMONOPOLET.NO</p>
  </div>
</div>
<script>
const API_URL = "https://vinanbefaling-gy7a.vercel.app/api/chat";

const CATS = [
  {label:"Rødvin",  value:"rødvin",        emoji:"🍷", color:"#8b1a1a"},
  {label:"Hvitvin", value:"hvitvin",        emoji:"🥂", color:"#c8a93a"},
  {label:"Rosé",    value:"rosévin",        emoji:"🌸", color:"#c06080"},
  {label:"Bobler",  value:"musserende vin", emoji:"✨", color:"#7a9aaa"},
  {label:"Dessert", value:"dessertvin",     emoji:"🍯", color:"#a07030"},
];
const PRS = [
  {label:"< 150",   value:"under 150 kr"},
  {label:"150–300", value:"mellom 150 og 300 kr"},
  {label:"300–600", value:"mellom 300 og 600 kr"},
  {label:"600+",    value:"over 600 kr"},
];
const STEPS = ["Spør sommelieren…","Søker viner…","Sjekker priser…","Setter sammen…"];

let catIdx=0, priceIdx=1, stepIv=null, stepI=0;

// Categories
const catsEl = document.getElementById("cats");
CATS.forEach((c,i) => {
  const b = document.createElement("button");
  b.className = "cat-btn";
  b.innerHTML = `${c.emoji} ${c.label}`;
  b.onclick = () => { catIdx=i; updateCats(); };
  catsEl.appendChild(b);
});
function updateCats() {
  document.querySelectorAll(".cat-btn").forEach((b,i) => {
    const c=CATS[i];
    if(i===catIdx){b.style.background=`linear-gradient(135deg,${c.color}44,${c.color}22)`;b.style.border=`1px solid ${c.color}99`;b.style.color="#f0e8d8";}
    else{b.style.background="rgba(255,255,255,.04)";b.style.border="1px solid rgba(255,255,255,.08)";b.style.color="rgba(255,255,255,.42)";}
  });
}
updateCats();

// Prices
const prsEl = document.getElementById("prices");
PRS.forEach((p,i) => {
  const b = document.createElement("button");
  b.className = "price-btn"+(i===1?" on":"");
  b.textContent = p.label;
  b.onclick = () => { priceIdx=i; document.querySelectorAll(".price-btn").forEach((x,j)=>x.classList.toggle("on",j===i)); };
  prsEl.appendChild(b);
});

const dishEl = document.getElementById("dish");
const goBtn  = document.getElementById("goBtn");
dishEl.addEventListener("input", ()=> goBtn.disabled=!dishEl.value.trim());
dishEl.addEventListener("keydown", e=> e.key==="Enter" && go());

function setLoading(on) {
  if(on){
    stepI=0; goBtn.disabled=true;
    goBtn.innerHTML=`<svg width="17" height="17" viewBox="0 0 17 17" fill="none" style="animation:spin 1s linear infinite"><circle cx="8.5" cy="8.5" r="6.5" stroke="rgba(255,255,255,.25)" stroke-width="2"/><path d="M8.5 2A6.5 6.5 0 0 1 15 8.5" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-linecap="round"/></svg><span id="stepTxt" style="animation:pulse 1.5s ease-in-out infinite">${STEPS[0]}</span>`;
    goBtn.style.cssText="width:100%;padding:15px;border-radius:13px;border:none;font-family:'Lato',sans-serif;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);cursor:not-allowed";
    stepIv=setInterval(()=>{stepI=(stepI+1)%STEPS.length;const el=document.getElementById("stepTxt");if(el)el.textContent=STEPS[stepI];},2200);
  } else {
    clearInterval(stepIv);
    goBtn.disabled=false;
    goBtn.innerHTML="🔍 Finn vinanbefaling";
    goBtn.style.cssText="width:100%;padding:15px;border-radius:13px;border:none;font-family:'Lato',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,#d4a843,#a07830);color:#1a0e04;transition:all .22s";
  }
}

function showErr(msg){const e=document.getElementById("errBox");e.style.display="block";e.textContent="⚠️ "+msg;}
function hideErr(){document.getElementById("errBox").style.display="none";}

function badge(score){
  const r=20,c=2*Math.PI*r,col=score>=85?"#d4a843":score>=70?"#7aaa5a":"#7a8aaa";
  return `<div class="badge"><svg width="50" height="50" viewBox="0 0 50 50"><circle cx="25" cy="25" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="3"/><circle cx="25" cy="25" r="${r}" fill="none" stroke="${col}" stroke-width="3" stroke-dasharray="${(score/100)*c} ${c}" stroke-linecap="round" transform="rotate(-90 25 25)"/><text x="25" y="30" text-anchor="middle" fill="${col}" font-size="12" font-weight="700" font-family="Georgia,serif">${score}</text></svg></div>`;
}

function renderCard(rec,i){
  const medals=["🥇","🥈","🥉"];
  const tags=(rec.taste_profile||"").split(/[,·]/).map(t=>t.trim()).filter(Boolean).map(t=>`<span class="tag">${t}</span>`).join("");
  const vin=rec.vintage&&rec.vintage!=="NV"?` · ${rec.vintage}`:"";
  const dets=[rec.grapes?`🍇 ${rec.grapes}`:"",rec.serving_temp?`🌡 ${rec.serving_temp}`:""].filter(Boolean).map(d=>`<span class="card-det">${d}</span>`).join("");
  const searchUrl=rec.url||"https://www.vinmonopolet.no/search?q="+encodeURIComponent(rec.name);
  return `<div class="card" style="animation-delay:${i*.12}s">
    <div class="card-top" onclick="toggle(this.closest('.card'))">
      ${badge(rec.match_score||0)}
      <div class="card-info">
        <div class="card-meta">${medals[i]||"🍷"} ${rec.region||rec.country||""}</div>
        <div class="card-name">${rec.name}</div>
        <div class="card-prod">${rec.producer||""}${vin}</div>
        <div class="tags">${tags}</div>
      </div>
      <div class="card-price">
        ${rec.price?`<div class="price-num">${rec.price}</div><div class="price-kr">kr</div>`:""}
        ${rec.alcohol?`<div class="price-alc">${rec.alcohol}%</div>`:""}
      </div>
    </div>
    <div class="expand">
      <div class="expand-inner">
        <p class="card-why">${rec.why||""}</p>
        <div class="card-dets">${dets}</div>
      </div>
    </div>
    <div style="padding:12px 0 4px;display:flex;align-items:center;justify-content:space-between">
      <a class="vmpol-btn" href="${searchUrl}" target="_blank" rel="noopener">
        ${searchUrl.includes("/search?") ? "Søk på Vinmonopolet →" : "Åpne på Vinmonopolet →"}
      </a>
      <span class="hint" style="margin:0" onclick="toggle(this.closest('.card'))">▼ MER</span>
    </div>
  </div>`;
}

window.toggle=function(el){
  const exp=el.querySelector(".expand"),hint=el.querySelector(".hint"),open=exp.classList.toggle("open");
  hint.textContent=open?"▲ LUKK":"▼ MER INFO";
};

async function callAI(messages, useTools){
  const body={
    model:"claude-sonnet-4-20250514",
    max_tokens:3000,
    system:`Du er en ekspert-sommelier. Finn 3 viner som passer til matretten.

STEG 1: Velg 3 passende viner.
STEG 2: For HVER vin, søk etter den på vinmonopolet.no, f.eks: søk "Primitivo di Manduria vinmonopolet.no" og finn den eksakte produktlenken (format: https://www.vinmonopolet.no/p/TALL eller https://www.vinmonopolet.no/…/p/TALL).
STEG 3: Returner KUN dette JSON-objektet, ingen annen tekst:
{"intro":"Én setning","recommendations":[{"name":"Produktnavn","producer":"Produsent","country":"Land","region":"Region","grapes":"Druer","vintage":"2021","price":249,"alcohol":"13.5","match_score":92,"why":"2 setninger matparing","taste_profile":"Frukt, fylde, syre","serving_temp":"16-18","url":"https://www.vinmonopolet.no/p/12345"}]}`,
    messages,
  };
  if(useTools) body.tools=[{type:"web_search_20250305",name:"web_search"}];
  const res=await fetch(API_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json",},
    body:JSON.stringify(body),
  });
  if(!res.ok){const t=await res.text();throw new Error("HTTP "+res.status+": "+t.slice(0,200));}
  return res.json();
}

async function go(){
  const dish=dishEl.value.trim();
  if(!dish) return;
  hideErr();
  document.getElementById("results").style.display="none";
  setLoading(true);

  const pref=document.getElementById("pref").value.trim();
  const userMsg=`Matrett: ${dish}
Vintype: ${CATS[catIdx].value}
Prisklasse: ${PRS[priceIdx].value}${pref?"\nPreferanser: "+pref:""}

Søk etter hver vin på vinmonopolet.no og finn ekte produktlenker.`;

  try {
    let messages=[{role:"user",content:userMsg}];
    let data=await callAI(messages, true);

    // Multi-turn: let web_search run
    for(let round=0;round<10;round++){
      if(data.stop_reason==="end_turn") break;
      if(data.stop_reason!=="tool_use") break;

      // Collect tool_use blocks
      const toolUses=data.content.filter(b=>b.type==="tool_use");
      if(!toolUses.length) break;

      // Find tool_result blocks that Anthropic already filled in
      const toolResults=data.content.filter(b=>b.type==="tool_result");

      // Add assistant turn
      messages.push({role:"assistant",content:data.content});

      if(toolResults.length>0){
        // Results already present — pass them as user turn
        messages.push({role:"user",content:toolResults});
      } else {
        // No results yet — acknowledge tool_use so Anthropic can fill them
        messages.push({role:"user",content:toolUses.map(b=>({
          type:"tool_result",
          tool_use_id:b.id,
          content:"Søkeresultater ikke tilgjengelig, bruk din kunnskap om Vinmonopolet."
        }))});
      }

      data=await callAI(messages, true);
    }

    // Parse JSON from final response
    const allText=(data?.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const clean=allText.replace(/```json|```/g,"").trim();
    const m=clean.match(/\{[\s\S]*\}/);
    if(!m) throw new Error("Prøv igjen.");
    const parsed=JSON.parse(m[0]);
    if(!parsed.recommendations?.length) throw new Error("Ingen viner returnert.");

    // Ensure URLs: use real URL if found, else build search URL as fallback
    parsed.recommendations=parsed.recommendations.map(r=>({
      ...r,
      url:(r.url&&r.url.includes("vinmonopolet.no")&&!r.url.includes("TALL")&&!r.url.includes("XXXXX"))
        ? r.url
        : "https://www.vinmonopolet.no/search?q="+encodeURIComponent(r.name)
    }));

    document.getElementById("divTxt").textContent="Til "+dish;
    const intro=document.getElementById("introTxt");
    if(parsed.intro){intro.textContent=`"${parsed.intro}"`;intro.style.display="block";}
    else intro.style.display="none";
    document.getElementById("cards").innerHTML=parsed.recommendations.map((r,i)=>renderCard(r,i)).join("");
    document.getElementById("results").style.display="block";
    setTimeout(()=>document.getElementById("results").scrollIntoView({behavior:"smooth",block:"start"}),100);

  } catch(e){
    showErr(e.message);
  }
  setLoading(false);
}

goBtn.onclick=go;
</script>
</body>
</html>
